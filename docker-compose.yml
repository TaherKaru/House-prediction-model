services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: housevalue
      POSTGRES_USER: housevalue
      POSTGRES_PASSWORD: change-me-before-production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housevalue -d housevalue"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://housevalue:change-me-before-production@database:5432/housevalue
      JWT_SECRET: replace-this-with-a-long-random-secret
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
